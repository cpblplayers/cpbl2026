<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CPBL 2026 球員名單</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:#f2f4f7;color:#1a1a2e;min-height:100vh}

.header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.header-title{font-size:17px;font-weight:700;letter-spacing:.5px}
.header-sub{font-size:11px;color:#aab;margin-top:2px}

/* filter */
.filter-panel{background:#fff;padding:10px 12px;border-bottom:1px solid #e4e6ea;position:sticky;top:61px;z-index:90;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.search-wrap{position:relative;margin-bottom:8px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.4}
#searchInput{width:100%;padding:9px 10px 9px 34px;border:1px solid #dde;border-radius:20px;font-size:14px;background:#f8f9fb;outline:none}
#searchInput:focus{border-color:#4e9af1;background:#fff}

.filter-row{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:16px;border:1.5px solid #dde;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;background:#fff;transition:.15s;user-select:none}
.chip.active{color:#fff!important;border-color:transparent}

/* team chip colors */
.chip-all.active{background:#4e9af1}
.chip-ctb.active{background:#FFD100;color:#002D62!important}
.chip-tsg.active{background:#004B23}
.chip-ww.active{background:#CD2027}
.chip-fb.active{background:#0047AB}
.chip-uni.active{background:#FF6600}
.chip-lt.active{background:#7D001A}
/* special chip */
.chip-bm.active{background:#7c3aed}
.chip-um.active{background:#0891b2}
.chip-coach.active{background:#78716c}
.chip-foreign.active{background:#be185d}
.chip-noag.active{background:#d97706}
.chip-nonmember.active{background:#555}


.result-count{padding:6px 14px;font-size:12px;color:#666;background:#f2f4f7}

/* cards */
.cards{padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.card{background:#fff;border-radius:12px;padding:12px 14px 12px 16px;box-shadow:0 1px 5px rgba(0,0,0,.08);border-left:5px solid #ccc;cursor:pointer;transition:.15s;position:relative}
.card:active{opacity:.8}
.card.t-ctb{border-left-color:#FFD100}
.card.t-tsg{border-left-color:#004B23}
.card.t-ww{border-left-color:#CD2027}
.card.t-fb{border-left-color:#0047AB}
.card.t-uni{border-left-color:#FF6600}
.card.t-lt{border-left-color:#7D001A}
.card.t-coach{border-left-color:#9ca3af}

/* big number on top-right */
.card-num{position:absolute;top:8px;right:14px;font-size:26px;font-weight:900;opacity:.13;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.card-logo-badge{position:absolute;top:8px;right:10px;width:38px;height:38px;object-fit:contain}

.card-name{font-size:18px;font-weight:800;line-height:1.2;padding-right:60px}
.card-org{font-size:12px;color:#888;font-weight:400;margin-top:1px}
.card-mid{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600}
.badge-team{color:#fff}
.badge-ctb{background:#FFD100;color:#002D62!important}
.badge-tsg{background:#004B23;color:#FFCC00!important}
.badge-ww{background:#CD2027}
.badge-fb{background:#0047AB}
.badge-uni{background:#FF6600}
.badge-lt{background:#7D001A}
.badge-coach{background:#6b7280;color:#fff}
.badge-l1{background:#dcfce7;color:#166534}
.badge-l2{background:#f3f4f6;color:#374151}
.badge-pos{background:#eff6ff;color:#1d4ed8}
.badge-bm{background:#f3e8ff;color:#7c3aed}
.bm-role-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.bm-role-lishi .bm-role-badge{background:#dbeafe;color:#1d4ed8}
.bm-role-jianshi .bm-role-badge{background:#f3e8ff;color:#7c3aed}
.bm-table tr:hover td{filter:brightness(0.97)}
.badge-um{background:#e0f2fe;color:#0369a1}
.badge-fgn{background:#fce7f3;color:#be185d}
.badge-eth{background:#fff7ed;color:#c2410c}

.card-bottom{margin-top:8px;font-size:12px;color:#666;display:flex;flex-wrap:wrap;gap:10px;border-top:1px solid #f4f5f7;padding-top:7px}
.card-bottom span{display:flex;align-items:center;gap:3px}

/* drawer */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:.25s}
.drawer-overlay.open{opacity:1;pointer-events:all}
.drawer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:20px 20px 36px;z-index:210;transform:translateY(100%);transition:.3s cubic-bezier(.4,0,.2,1);max-height:88vh;overflow-y:auto}
.drawer.open{transform:translateY(0)}
.drawer-handle{width:40px;height:4px;background:#dde;border-radius:2px;margin:0 auto 18px}
.drawer-num{font-size:48px;font-weight:900;opacity:.1;position:absolute;right:24px;top:20px;line-height:1}
.drawer-name{font-size:24px;font-weight:900;margin-bottom:3px}
.drawer-sub{font-size:13px;color:#888;margin-bottom:14px}
.drawer-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:18px}
.drawer-hero{width:100%;height:150px;border-radius:14px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:relative;overflow:hidden}
.drawer-hero .hero-bg-logo{position:absolute;right:-10px;bottom:-10px;width:130px;height:130px;object-fit:contain;opacity:.18}
.drawer-hero .hero-left{position:relative;z-index:1}
.drawer-hero .hero-no{font-size:54px;font-weight:900;color:#fff;line-height:1;opacity:.9;letter-spacing:-1px}
.drawer-hero .hero-name{font-size:18px;font-weight:800;color:#fff;margin-top:4px;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.drawer-hero .hero-team{font-size:12px;color:rgba(255,255,255,.75);margin-top:2px}
.drawer-hero .hero-logo{position:relative;z-index:1;width:60px;height:60px;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.25))}
.drawer-rows{display:flex;flex-direction:column;gap:11px}
.drawer-sig{margin-top:18px;text-align:center;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.drawer-sig a{display:inline-flex;align-items:center;gap:7px;color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;font-weight:700;text-decoration:none;letter-spacing:.3px}
.drawer-sig a.btn-cpbl{background:linear-gradient(135deg,#c0392b,#922b21);box-shadow:0 2px 8px rgba(192,57,43,.4)}
.drawer-sig a.btn-sig{background:linear-gradient(135deg,#1a73e8,#1558b0);box-shadow:0 2px 8px rgba(26,115,232,.35)}
.drawer-sig a:active{opacity:.8;transform:scale(.97)}
.drawer-row{display:flex;gap:10px;font-size:14px;border-bottom:1px solid #f4f5f7;padding-bottom:10px}
.drawer-row:last-child{border-bottom:none}
.drawer-label{color:#999;min-width:72px;flex-shrink:0;font-size:12px;padding-top:2px}
.drawer-val{font-weight:700;word-break:break-all}

/* report */
.report{padding:12px;display:flex;flex-direction:column;gap:12px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-card{background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat-num{font-size:30px;font-weight:900;color:#4e9af1}
.stat-label{font-size:12px;color:#888;margin-top:2px}
.section-title{font-size:15px;font-weight:700;color:#333;padding:4px 0 6px}
.table-card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:#999;font-weight:600;padding:4px 6px 8px 0;border-bottom:1px solid #eee;font-size:12px}
.tbl td{padding:8px 6px 8px 0;border-bottom:1px solid #f4f4f6}
.tbl tr:last-child td{border-bottom:none}
.bar{height:6px;background:#4e9af1;border-radius:3px;display:block;min-width:2px}
.team-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.bm-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f4f4f6;font-size:13px}
.bm-item:last-child{border-bottom:none}
.bm-name{font-weight:700}
.bm-info{color:#888;font-size:12px;margin-top:1px}

/* bottom nav */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e4e6ea;display:flex;z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.bottom-tab{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:transparent;font-size:10px;font-weight:600;color:#aaa;transition:.2s}
.bottom-tab.active{color:#4e9af1}
.bottom-tab svg{width:22px;height:22px}
.page-content{padding-bottom:62px}
.hidden{display:none!important}
.empty{text-align:center;padding:48px 20px;color:#aaa}
.empty svg{width:48px;height:48px;opacity:.3;margin-bottom:12px;display:block;margin-left:auto;margin-right:auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

      <div class="chip chip-uni" data-filter="team" data-val="統一獅" style="color:#FF6600">統一獅</div>

  </div>
  <div class="result-count" id="resultCount"></div>
  <div class="cards" id="cardList"></div>
  <div class="empty hidden" id="emptyState">

  </div>
</div>

<div id="pageReport" class="hidden">
  <div class="report" id="reportContent"></div>
</div>

</div>

<div class="bottom-bar">

  </button>
</div>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div id="drawerContent"></div>
</div>

let filterTeam = '';
let filterSpecials = new Set();
let filterForeign = true;

function calcAge(bdStr) {
  if (!bdStr) return '';
  const parts = bdStr.split('-');
  if (parts.length < 3) return '';
  const bd = new Date(+parts[0], +parts[1]-1, +parts[2]);
  let age = TODAY.getFullYear() - bd.getFullYear();
  const m = TODAY.getMonth() - bd.getMonth();
  if (m < 0 || (m === 0 && TODAY.getDate() < bd.getDate())) age--;
  return age > 0 ? `${age}歲` : '';
}

document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => {
    const ft = c.dataset.filter;
    const val = c.dataset.val;
    if (ft === 'team') {
      document.querySelectorAll('[data-filter=team]').forEach(x => {
        x.classList.remove('active');
        const tc = TEAM_TEXT[x.dataset.val];
        if (tc) x.style.color = tc; else x.style.color = '';
      });
      c.classList.add('active');
      c.style.color = '';
      filterTeam = val;
    } else if (ft === 'foreign') {
      filterForeign = !filterForeign;
      c.classList.toggle('active', filterForeign);
    } else if (ft === 'special') {
      const was = c.classList.contains('active');
      document.querySelectorAll('[data-filter=special]').forEach(x => x.classList.remove('active'));
      filterSpecials.clear();
      if (!was) { c.classList.add('active'); filterSpecials.add(val); }
    }
    render();
  });
});

function teamClass(t) { return TEAM_CLASS[t] || 'coach'; }
function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function teamBadgeColor(t) {
  const bg = TEAM_COLOR[t] || '#888';
  // 黃色系（中信兄弟）文字用深色
  const dark = ['中信兄弟'].includes(t);
  return { bg, text: dark ? '#222' : '#fff' };
}

function getFiltered() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const showCoach = filterSpecials.has('coach');
  return PLAYERS.filter(p => {
    if (p.fc === '教練' && !showCoach) return false;
    if (filterTeam && p.t !== filterTeam) return false;
    if (filterSpecials.has('bm') && !BOARD_ROLES.includes(p.bm)) return false;
    if (filterSpecials.has('um') && p.um !== '會員') return false;
    if (!filterForeign && p.fc === '外籍') return false;
    if (filterSpecials.has('noag') && p.ag) return false;
    if (filterSpecials.has('nonmember') && p.bm !== '非會員') return false;
    if (q) {
      const fields = [p.n, p.no, p.pos, p.ag, p.eth, p.bm].join(' ').toLowerCase();
      if (!fields.includes(q)) return false;
    }
    return true;
  });
}

function render() {
  const filtered = getFiltered();
  const list = document.getElementById('cardList');
  const empty = document.getElementById('emptyState');
  document.getElementById('resultCount').textContent = `共 ${filtered.length} 人`;
  if (filtered.length === 0) {
    list.innerHTML = ''; empty.classList.remove('hidden'); return;
  }
  empty.classList.add('hidden');
  const html = filtered.map((p, idx) => {
    const tc = teamClass(p.t);
    const isCoach = p.fc === '教練';
    const isForeign = p.fc === '外籍';
    const isBM = BOARD_ROLES.includes(p.bm);
    const isUM = p.um === '會員';
    const hasEth = p.eth && p.eth.trim();
    const age = calcAge(p.bd);
    const noStr = p.no || '—';

    const logoFile = TEAM_LOGO[p.t];
    let teamBadge = isCoach
      ? `<span class="badge badge-coach">教練</span>`
      : logoFile ? `<img src="${logoFile}" alt="${p.t}" style="width:28px;height:28px;object-fit:contain;border-radius:4px;background:#111;vertical-align:middle">` : '';
    let levelBadge = (!isCoach && p.lv) ? `<span class="badge badge-${p.lv === '一軍' ? 'l1' : 'l2'}">${p.lv}</span>` : '';
    let posBadge = p.pos ? `<span class="badge badge-pos">${p.pos}</span>` : '';
    const bmStyle = 'font-size:12px;font-weight:800;color:#fff;background:#7c3aed;padding:2px 8px;border-radius:8px;margin-left:14px;letter-spacing:.3px';
    let bmBadge = (p.bm && p.bm !== '非會員') ? `<span style="${bmStyle}">${p.bm}</span>` : '';
    let fgnBadge = isForeign ? `<span class="badge badge-fgn">外籍</span>` : '';
    let ethBadge = hasEth ? `<span class="badge badge-eth">${p.eth}</span>` : '';
    let ageBadge = age ? `<span style="font-size:11px;color:#94a3b8;margin-right:2px">🎂 <b>${age}</b></span>` : '';
    let agBadge = p.ag ? `<span style="font-size:11px;color:#94a3b8;margin-left:2px">🤝 ${p.ag}</span>` : '';

    const logoBadge = logoFile ? `<img class="card-logo-badge" src="${logoFile}" alt="${p.t}">` : '';
    return `<div class="card t-${tc}" onclick="showDetail(${idx},getFiltered())">
      ${logoBadge}
      <div class="card-name">${p.n}<span style="font-size:12px;font-weight:800;color:#fff;background:#333;padding:2px 7px;border-radius:8px;margin-left:8px;letter-spacing:.5px">${noStr}</span>${bmBadge}</div>
      <div class="card-mid">${ageBadge}${levelBadge}${posBadge}${fgnBadge}${ethBadge}${agBadge}</div>
    </div>`;
  }).join('');
  list.innerHTML = html;
}

      <div class="hero-no">${heroNoDisplay}</div>
      <div class="hero-name">${p.n}</div>
      <div class="hero-team">${p.t}${p.lv ? ' · '+p.lv : ''}</div>
    </div>
    ${heroLogo ? `<img class="hero-logo" src="${heroLogo}" alt="${p.t}"><img class="hero-bg-logo" src="${heroLogo}" alt="">` : ''}
  </div>`;
  const sigUrl = 'https://www.google.com/search?q=' + encodeURIComponent('職棒' + p.n + '簽名') + '&tbm=isch';
  document.getElementById('drawerContent').innerHTML = `
    ${heroHtml}
    <div class="drawer-badges">${badges}</div>
    <div class="drawer-rows">${rows}</div>
    <div class="drawer-sig">
      ${p.url ? `<a href="${p.url}" target="_blank" class="btn-cpbl">🏟️ 聯盟球員頁</a>` : ''}
      <a href="${sigUrl}" target="_blank" class="btn-sig">🔍 搜尋簽名圖片</a>
    </div>`;
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

function switchPage(page) {
  document.getElementById('pagePlayer').classList.toggle('hidden', page !== 'player');
  document.getElementById('pageReport').classList.toggle('hidden', page !== 'report');
  document.getElementById('tabPlayer').classList.toggle('active', page === 'player');
  document.getElementById('tabReport').classList.toggle('active', page === 'report');
  if (page === 'report') buildReport();
}

function buildReport() {
  const players = PLAYERS.filter(p => p.fc !== '教練');
  const coaches = PLAYERS.filter(p => p.fc === '教練');
  const foreign = players.filter(p => p.fc === '外籍');
  const domestic = players.filter(p => p.fc !== '外籍');
  const union = players.filter(p => p.um === '會員');
  const boardMembers = PLAYERS.filter(p => BOARD_ROLES.includes(p.bm));
  const indigenous = players.filter(p => p.eth && p.eth.trim());
  const TEAMS = ['中信兄弟','台鋼雄鷹','味全龍','富邦悍將','統一獅','樂天桃猿'];

  // 各隊球員數（合併表格）
  const teamRows = TEAMS.map(t => {
    const all = players.filter(p => p.t === t);
    const tDom = all.filter(p => p.fc !== '外籍').length;
    const tFor = all.filter(p => p.fc === '外籍').length;
    const tUni = all.filter(p => p.um === '會員').length;
    const ratio = tDom > 0 ? Math.round(tUni / tDom * 100) : 0;
    return `<tr>
      <td><img src="${TEAM_LOGO[t]}" alt="${t}" style="width:32px;height:32px;object-fit:contain;vertical-align:middle;border-radius:4px"></td>
      <td style="font-weight:700">${all.length}</td>
      <td>${tDom}</td>
      <td style="color:#be185d">${tFor}</td>
      <td style="color:#0891b2;font-weight:600">${tUni}</td>
      <td style="color:#7c3aed">${ratio}%</td>
    </tr>`;
  }).join('');
  const totDom = domestic.length;
  const totFor = foreign.length;
  const totUni = union.length;
  const totRatio = totDom > 0 ? Math.round(totUni / totDom * 100) : 0;
  const teamTotalRow = `<tr style="font-weight:700;background:#f0f4ff;border-top:2px solid #c7d2fe">
    <td>合計</td><td>${players.length}</td><td>${totDom}</td>
    <td style="color:#be185d">${totFor}</td>
    <td style="color:#0891b2">${totUni}</td>
    <td style="color:#7c3aed">${totRatio}%</td>
  </tr>`;

  // 理監事名單（表格，依職稱排序，理事/監事分色）
  const bmSeen = new Set();
  const bmSorted = boardMembers.filter(p => {
    if (bmSeen.has(p.n)) return false;
    bmSeen.add(p.n); return true;
  }).sort((a, b) => BOARD_ROLES.indexOf(a.bm) - BOARD_ROLES.indexOf(b.bm));

  const isJianShi = r => ['常務監事','監事','候補監事'].includes(r);
  const bmTableRows = bmSorted.map(p => {
    const cls = isJianShi(p.bm) ? 'bm-role-jianshi' : 'bm-role-lishi';
    const tc = TEAM_COLOR[p.t] || '#888';
    return `<tr class="${cls}">
      <td><span class="bm-role-badge ${cls}">${p.bm}</span></td>
      <td style="font-weight:700">${p.n}</td>
      <td>${TEAM_LOGO[p.t] ? `<img src="${TEAM_LOGO[p.t]}" alt="${p.t}" style="width:28px;height:28px;object-fit:contain;border-radius:4px;vertical-align:middle">` : p.t}</td>
      <td style="color:#888">${p.lv || ''}</td>
    </tr>`;
  }).join('');

  // 經紀公司 × 各隊交叉統計（排除外籍、教練、無經紀）
  // TEAMS 已在上方宣告
  const agMap = {};
  players.filter(p => p.ag && p.fc !== '外籍').forEach(p => {
    if (!agMap[p.ag]) agMap[p.ag] = {total:0};
    agMap[p.ag].total++;
    agMap[p.ag][p.t] = (agMap[p.ag][p.t] || 0) + 1;
  });
  const agSorted = Object.entries(agMap).sort((a,b) => b[1].total - a[1].total).slice(0,15);
  const agentRows = agSorted.map(([ag, data]) => {
    const teamCells = TEAMS.map(t => `<td style="text-align:center;color:${data[t] ? TEAM_COLOR[t] : '#ddd'};font-weight:${data[t]?'700':'400'}">${data[t] || '—'}</td>`).join('');
    return `<tr><td style="font-size:12px;max-width:110px;word-break:break-all">${ag}</td><td style="font-weight:700;color:#4e9af1;text-align:center">${data.total}</td>${teamCells}</tr>`;
  }).join('');
  const agTeamLogos = TEAMS.map(t => `<th style="text-align:center;padding:4px 2px"><img src="${TEAM_LOGO[t]}" alt="${t}" style="width:24px;height:24px;object-fit:contain"></th>`).join('');

  document.getElementById('reportContent').innerHTML = `
    <div><div class="section-title">📊 整體概況</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-num">${players.length}</div><div class="stat-label">球員總人數</div></div>
        <div class="stat-card"><div class="stat-num">${coaches.length}</div><div class="stat-label">教練人數</div></div>
        <div class="stat-card"><div class="stat-num" style="color:#0891b2">${union.length}</div><div class="stat-label">工會會員</div></div>
        <div class="stat-card"><div class="stat-num" style="color:#be185d">${foreign.length}</div><div class="stat-label">外籍球員</div></div>
        <div class="stat-card"><div class="stat-num" style="color:#c2410c">${indigenous.length}</div><div class="stat-label">原住民球員</div></div>
        <div class="stat-card"><div class="stat-num" style="color:#7c3aed">${boardMembers.length}</div><div class="stat-label">理監事人數</div></div>
      </div></div>
    <div><div class="section-title">⚾ 各隊球員數</div>
      <div class="table-card"><table class="tbl">
        <thead><tr><th>球隊</th><th>總人數</th><th>本土</th><th>外籍</th><th>工會會員</th><th>會員/本土</th></tr></thead>
        <tbody>${teamRows}${teamTotalRow}</tbody>
      </table></div></div>
    <div><div class="section-title">🏛️ 理監事名單</div>
      <div class="table-card"><table class="tbl bm-table">
        <thead><tr><th style="width:90px">職稱</th><th>姓名</th><th>球隊</th><th>軍別</th></tr></thead>
        <tbody>${bmTableRows}</tbody>
      </table></div></div>
    <div><div class="section-title">🤝 經紀公司 × 各隊（前15，本土球員）</div>
      <div class="table-card" style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>經紀公司</th><th style="text-align:center">合計</th>${agTeamLogos}</tr></thead>
        <tbody>${agentRows}</tbody>
      </table></div></div>`;
}

// ── 動態更新 ──
const API_URL = 'https://script.google.com/macros/s/AKfycbwMGhnlAQ5gpZ30nmMhwK8Xm4y8PvivngMpbJTBWdd529ffcUyYyFrf_OBOZvI6mODm/exec?action=players';

function fetchLive() {
  const btn    = document.getElementById('refreshBtn');
  const icon   = document.getElementById('refreshIcon');
  const status = document.getElementById('syncStatus');
  btn.disabled = true;
  icon.style.animation = 'spin 1s linear infinite';
  status.textContent = '正在從試算表更新…';

  fetch(API_URL, { redirect: 'follow' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      if (!Array.isArray(data) || data.length === 0) throw new Error('空資料');
      PLAYERS.length = 0;
      data.forEach(p => PLAYERS.push(p));
      render();
      if (!document.getElementById('pageReport').classList.contains('hidden')) buildReport();
      const now = new Date();
      const ts  = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      status.textContent = `✅ 已更新 ${ts}（${data.length} 筆）`;
    })
    .catch(err => { status.textContent = '⚠️ 使用快照資料（' + err.message + '）'; })
    .finally(() => { btn.disabled = false; icon.style.animation = ''; });
}

render();
fetchLive();  // 頁面載入時自動嘗試同步

</script>
</body>
</html>
